services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nawakes-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Nawakes_Strong_Pass_2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Nawakes_Strong_Pass_2026!}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Nawakes_Strong_Pass_2026!}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nawakes-network

  redis:
    image: redis:7-alpine
    container_name: nawakes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nawakes-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawakes-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NawakesDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Nawakes_Strong_Pass_2026!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=3000,syncTimeout=3000"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-REPLACE_WITH_A_32_CHAR_MIN_SECRET_KEY_IN_PROD}"
      Jwt__Issuer: "nawakes-api"
      Jwt__Audience: "nawakes-app"
      Encryption__Key: "${ENCRYPTION_KEY:-REPLACE_WITH_A_STRONG_RANDOM_SECRET_IN_PROD}"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nawakes-network

volumes:
  sqlserver_data:
  redis_data:

networks:
  nawakes-network:
    driver: bridge
